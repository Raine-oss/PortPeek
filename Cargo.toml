[package]
name = "portpeek"
version = "0.2.0"
edition = "2024"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
criterion = { version = "0.5", features = ["async_tokio"] }
libc = "0.2"

[[bench]]
name = "scan_benchmark"
harness = false
